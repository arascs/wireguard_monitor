<!DOCTYPE html>
<html>

<head>
    <title>WireGuard VPN Manager - Users</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <style>
        .section-title {
            color: rgba(134, 22, 24, 1);
            margin-top: 10px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ddd;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        .simple-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background-color: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .simple-table th,
        .simple-table td {
            padding: 8px 10px;
            border-bottom: 1px solid #eee;
            font-size: 0.9rem;
            text-align: left;
        }

        .simple-table th {
            background-color: #fafafa;
            font-weight: 600;
        }

        .simple-table tbody tr:nth-child(even) {
            background-color: #fcfcfc;
        }

        button {
            cursor: pointer;
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            background-color: rgba(134, 22, 24, 0.8);
            color: white;
            transition: background-color 0.3s;
            font-weight: 500;
            font-size: 0.9rem;
            font-family: inherit;
        }

        button:hover {
            background-color: rgba(134, 22, 24, 1);
        }

        .btn-delete {
            padding: 6px 12px;
            background-color: #dc3545;
            font-size: 0.85rem;
        }

        .btn-delete:hover {
            background-color: #c82333;
        }

        .btn-icon {
            background: none;
            border: 1px solid #ccc;
            color: #444;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            vertical-align: middle;
        }

        .btn-icon:hover {
            background: rgba(134, 22, 24, 0.07);
            border-color: rgba(134, 22, 24, 0.4);
            color: rgba(134, 22, 24, 1);
        }

        .actions-cell {
            white-space: nowrap;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 8000;
            align-items: center;
            justify-content: center;
        }

        .modal.open {
            display: flex;
        }

        .modal-box {
            background: #fff;
            border-radius: 8px;
            padding: 24px;
            width: min(420px, calc(100vw - 32px));
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }

        .modal-box h3 {
            margin: 0 0 16px;
            color: rgba(134, 22, 24, 1);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 16px;
        }

        .toolbar {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 8px;
        }
    </style>
</head>

<body data-current="users">

    <div id="main-content">
        <h2 class="section-title">Users</h2>

        <div class="toolbar">
            <button id="btn-add-user" type="button">Add user</button>
            <button id="btn-export-users" type="button">Export</button>
        </div>
        <table class="simple-table" id="users-table">
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Create Day</th>
                    <th>Expire Day</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="users-tbody"></tbody>
        </table>
    </div>

    <div id="create-user-modal" class="modal">
        <div class="modal-box">
            <h3>Add user</h3>
            <form id="create-user-form">
                <div class="form-group">
                    <label for="user-username">Username</label>
                    <input type="text" id="user-username" required>
                </div>
                <div class="form-group">
                    <label for="user-password">Password</label>
                    <input type="password" id="user-password" required>
                </div>
                <div class="form-group">
                    <label for="user-expire">Expire Days</label>
                    <input type="number" id="user-expire" placeholder="Ex: 90" min="1">
                </div>
                <div class="modal-actions">
                    <button type="button" id="create-user-cancel">Cancel</button>
                    <button type="submit">Create</button>
                </div>
            </form>
        </div>
    </div>

    <div id="edit-user-modal" class="modal">
        <div class="modal-box">
            <h3>Edit user</h3>
            <form id="edit-user-form">
                <div class="form-group">
                    <label for="edit-user-username">Username</label>
                    <input type="text" id="edit-user-username" readonly>
                </div>
                <div class="form-group">
                    <label for="edit-user-expire">Expire date (empty = never)</label>
                    <input type="date" id="edit-user-expire">
                </div>
                <div class="modal-actions">
                    <button type="button" id="edit-user-cancel">Cancel</button>
                    <button type="submit">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/navbar.js"></script>
    <script src="/js/export.js"></script>
    <script src="/js/users.js"></script>
</body>

</html>
